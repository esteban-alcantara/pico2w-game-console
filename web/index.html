<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Mini Consola PICO2W</title>

        <!-- Bootstrap -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <main class="container py-5">
            <section class="text-center mb-5">
                <h1 class="titulo-principal">
                    Consola de videojuegos con Raspberry PICO 2W
                </h1>
                <p class="text-secondary">
                    Muestra datos enviados por la Pico 2W mediante Wi-Fi.
                </p>
            </section>

            <section class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card shadow-lg tarjeta-monitor">
                        <div class="card-body">
                            <h5 class="card-title mb-3">Últimos datos</h5>

                            <div class="mb-3">
                                <span
                                    class="badge bg-info text-dark"
                                    id="estadoConexion"
                                >
                                    Esperando conexión...
                                </span>
                            </div>

                            <!-- Tabs -->
                            <ul
                                class="nav nav-tabs mb-3"
                                id="tabsPico"
                                role="tablist"
                            >
                                <li class="nav-item" role="presentation">
                                    <button
                                        class="nav-link active"
                                        id="sistema-tab"
                                        data-bs-toggle="tab"
                                        data-bs-target="#sistema"
                                        type="button"
                                        role="tab"
                                    >
                                        Sistema
                                    </button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button
                                        class="nav-link"
                                        id="snake-tab"
                                        data-bs-toggle="tab"
                                        data-bs-target="#snake"
                                        type="button"
                                        role="tab"
                                    >
                                        Snake
                                    </button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button
                                        class="nav-link"
                                        id="blocks-tab"
                                        data-bs-toggle="tab"
                                        data-bs-target="#blocks"
                                        type="button"
                                        role="tab"
                                    >
                                        Blocks
                                    </button>
                                </li>
                            </ul>

                            <div class="tab-content" id="tabsContent">
                                <div
                                    class="tab-pane fade show active"
                                    id="sistema"
                                    role="tabpanel"
                                >
                                    <pre id="sistemaSalida" class="json-box">
Cargando datos del sistema...</pre
                                    >
                                </div>
                                <div
                                    class="tab-pane fade"
                                    id="snake"
                                    role="tabpanel"
                                >
                                    <p>
                                        Puntuación:
                                        <span id="snakeScore">0</span>
                                    </p>
                                </div>
                                <div
                                    class="tab-pane fade"
                                    id="blocks"
                                    role="tabpanel"
                                >
                                    <p>
                                        Puntuación:
                                        <span id="blocksScore">0</span>
                                    </p>
                                </div>
                            </div>

                            <button
                                class="btn btn-primary w-100 mt-3"
                                id="btnActualizar"
                            >
                                Actualizar ahora
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Bootstrap JS (para tabs) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <!-- JS propio -->
        <script src="script.js"></script>
    </body>
</html>
