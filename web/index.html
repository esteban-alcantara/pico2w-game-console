<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Monitor JSON Pico 2W</title>

        <!-- Bootstrap -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <!-- CSS propio -->
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <main class="container py-5">
            <section class="text-center mb-5">
                <h1 class="titulo-principal">
                    Monitor JSON - Raspberry Pi Pico 2W
                </h1>
                <p class="text-secondary">
                    Página web para consultar datos enviados por la Pico 2W
                    mediante Wi-Fi.
                </p>
            </section>

            <section class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card shadow-lg tarjeta-monitor">
                        <div class="card-body">
                            <h5 class="card-title mb-3">
                                Último JSON recibido
                            </h5>

                            <div class="mb-3">
                                <span
                                    class="badge bg-info text-dark"
                                    id="estadoConexion"
                                >
                                    Esperando conexión...
                                </span>
                            </div>

                            <pre id="jsonSalida" class="json-box">
Esperando datos...</pre
                            >

                            <button
                                class="btn btn-primary w-100 mt-3"
                                id="btnActualizar"
                            >
                                Actualizar ahora
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- JS propio -->
        <script src="script.js"></script>
    </body>
</html>
